name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/dungeon/package-lock.json

      - name: Install dungeon dependencies
        working-directory: games/dungeon
        run: npm ci

      - name: Test dungeon
        working-directory: games/dungeon
        run: npm test

      - name: Build dungeon
        working-directory: games/dungeon
        run: npm run build

      - name: Enable pnpm
        run: corepack enable

      - name: Install Happy Aquarium dependencies
        working-directory: games/happy-aquarium
        run: pnpm install --frozen-lockfile

      - name: Test Happy Aquarium
        working-directory: games/happy-aquarium
        run: pnpm test

      - name: Build Happy Aquarium
        working-directory: games/happy-aquarium
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/games/dungeon
          mkdir -p _site/games/dungeon
          cp -R games/dungeon/dist/. _site/games/dungeon/
          rm -rf _site/games/happy-aquarium
          mkdir -p _site/games/happy-aquarium
          cp -R games/happy-aquarium/dist/. _site/games/happy-aquarium/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
