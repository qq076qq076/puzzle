<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" shape-rendering="crispEdges">

  <!-- ===== 尾鰭 ===== -->
  <!-- 外框 -->
  <rect x="0" y="10" width="1" height="12" fill="#a84200"/>
  <rect x="1" y="9" width="1" height="1" fill="#a84200"/>
  <rect x="1" y="22" width="1" height="1" fill="#a84200"/>
  <rect x="2" y="8" width="1" height="1" fill="#a84200"/>
  <rect x="2" y="23" width="1" height="1" fill="#a84200"/>
  <rect x="3" y="8" width="3" height="1" fill="#a84200"/>
  <rect x="3" y="23" width="3" height="1" fill="#a84200"/>
  <!-- 填充 -->
  <rect x="1" y="10" width="1" height="12" fill="#ff8800"/>
  <rect x="2" y="9" width="1" height="1" fill="#ff8800"/>
  <rect x="2" y="22" width="1" height="1" fill="#ff8800"/>
  <rect x="3" y="9" width="3" height="14" fill="#ff8800"/>

  <!-- ===== 身體外框 ===== -->
  <rect x="6" y="7" width="20" height="1" fill="#a84200"/>
  <rect x="6" y="24" width="20" height="1" fill="#a84200"/>
  <rect x="5" y="8" width="1" height="16" fill="#a84200"/>
  <rect x="26" y="8" width="1" height="1" fill="#a84200"/>
  <rect x="27" y="9" width="1" height="14" fill="#a84200"/>
  <rect x="26" y="23" width="1" height="1" fill="#a84200"/>

  <!-- ===== 身體填充 ===== -->
  <rect x="6" y="8" width="20" height="16" fill="#ff7b00"/>

  <!-- ===== 白紋（含深色邊框） ===== -->
  <!-- 尾柄白紋 -->
  <rect x="7" y="6" width="2" height="1" fill="#553300"/>
  <rect x="7" y="25" width="2" height="1" fill="#553300"/>
  <rect x="7" y="8" width="2" height="16" fill="#fff"/>
  <rect x="7" y="7" width="1" height="1" fill="#553300"/>
  <rect x="8" y="7" width="1" height="1" fill="#553300"/>
  <rect x="7" y="24" width="1" height="1" fill="#553300"/>
  <rect x="8" y="24" width="1" height="1" fill="#553300"/>
  <!-- 中帶白紋 -->
  <rect x="13" y="6" width="3" height="1" fill="#553300"/>
  <rect x="13" y="25" width="3" height="1" fill="#553300"/>
  <rect x="13" y="8" width="3" height="16" fill="#fff"/>
  <rect x="13" y="7" width="1" height="1" fill="#553300"/>
  <rect x="14" y="7" width="1" height="1" fill="#553300"/>
  <rect x="15" y="7" width="1" height="1" fill="#553300"/>
  <rect x="13" y="24" width="1" height="1" fill="#553300"/>
  <rect x="14" y="24" width="1" height="1" fill="#553300"/>
  <rect x="15" y="24" width="1" height="1" fill="#553300"/>
  <!-- 頭後白紋 -->
  <rect x="20" y="6" width="2" height="1" fill="#553300"/>
  <rect x="20" y="25" width="2" height="1" fill="#553300"/>
  <rect x="20" y="8" width="2" height="16" fill="#fff"/>
  <rect x="20" y="7" width="1" height="1" fill="#553300"/>
  <rect x="21" y="7" width="1" height="1" fill="#553300"/>
  <rect x="20" y="24" width="1" height="1" fill="#553300"/>
  <rect x="21" y="24" width="1" height="1" fill="#553300"/>

  <!-- ===== 背鰭 ===== -->
  <rect x="10" y="4" width="10" height="1" fill="#a84200"/>
  <rect x="9" y="5" width="1" height="3" fill="#a84200"/>
  <rect x="20" y="5" width="1" height="3" fill="#a84200"/>
  <rect x="10" y="5" width="10" height="3" fill="#ff9933"/>
  <rect x="10" y="4" width="10" height="1" fill="#ff9933"/>

  <!-- ===== 腹鰭 ===== -->
  <rect x="10" y="27" width="7" height="1" fill="#a84200"/>
  <rect x="9" y="25" width="1" height="3" fill="#a84200"/>
  <rect x="17" y="25" width="1" height="3" fill="#a84200"/>
  <rect x="10" y="25" width="7" height="2" fill="#ff9933"/>
  <rect x="10" y="27" width="7" height="1" fill="#ff9933"/>

  <!-- ===== 胸鰭 ===== -->
  <rect x="17" y="16" width="5" height="1" fill="#a84200"/>
  <rect x="16" y="17" width="1" height="2" fill="#a84200"/>
  <rect x="22" y="17" width="1" height="2" fill="#a84200"/>
  <rect x="17" y="19" width="5" height="1" fill="#a84200"/>
  <rect x="17" y="17" width="5" height="2" fill="#ffaa33"/>

  <!-- ===== 眼睛 ===== -->
  <rect x="23" y="9" width="3" height="3" fill="#fff"/>
  <rect x="24" y="10" width="2" height="2" fill="#222"/>
  <rect x="24" y="9" width="1" height="1" fill="#fff"/>

  <!-- ===== 嘴巴 ===== -->
  <rect x="27" y="15" width="1" height="1" fill="#a84200"/>

  <!-- ===== 腹部亮面 ===== -->
  <rect x="8" y="22" width="16" height="1" fill="#ffb066" opacity="0.5"/>

</svg>
