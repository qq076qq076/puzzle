<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171513" />
    <meta name="description" content="賭拳：先選定剪刀、石頭或布，觀看 90 個拳種圖示在拳台上移動、碰撞，直到只剩一種。" />
    <title>賭拳 · Puzzle Club</title>
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="duquan-page">
    <main class="page-shell duquan-shell">
      <a class="back-link duquan-back-link" href="../../index.html"><span aria-hidden="true">←</span> 回到遊戲列表</a>
      <header class="duquan-header">
        <h1>賭拳<span>.</span></h1>
        <p class="duquan-summary">選一種拳，觀察 90 個圖示決出最後霸主。</p>
        <button class="duquan-quiet-button" id="reset-button" type="button">重新配置</button>
      </header>

      <section aria-label="賭拳遊戲">
        <section class="duquan-setup" aria-label="選擇拳種">
          <div class="duquan-choice-grid" role="group" aria-label="選擇剪刀石頭布">
              <button class="duquan-choice is-scissors" type="button" data-choice="scissors" aria-pressed="false">
                <span class="duquan-choice-icon" aria-hidden="true"><img src="assets/scissors.svg" alt="" /></span>
                <b>剪刀</b>
              </button>
              <button class="duquan-choice is-rock" type="button" data-choice="rock" aria-pressed="false">
                <span class="duquan-choice-icon" aria-hidden="true"><img src="assets/rock.svg" alt="" /></span>
                <b>石頭</b>
              </button>
              <button class="duquan-choice is-paper" type="button" data-choice="paper" aria-pressed="false">
                <span class="duquan-choice-icon" aria-hidden="true"><img src="assets/paper.svg" alt="" /></span>
                <b>布</b>
              </button>
          </div>

          <section class="duquan-population" id="population-panel" aria-label="目前拳種佔比" hidden>
            <div class="duquan-population-list">
              <div class="duquan-population-row">
                <div class="duquan-population-label"><span class="duquan-population-icon is-scissors"><img src="assets/scissors.svg" alt="" aria-hidden="true" /></span><span>剪刀</span></div>
                <div class="duquan-population-track"><span class="duquan-population-fill is-scissors" id="population-fill-scissors"></span></div>
                <strong id="population-value-scissors">33%</strong>
              </div>
              <div class="duquan-population-row">
                <div class="duquan-population-label"><span class="duquan-population-icon is-rock"><img src="assets/rock.svg" alt="" aria-hidden="true" /></span><span>石頭</span></div>
                <div class="duquan-population-track"><span class="duquan-population-fill is-rock" id="population-fill-rock"></span></div>
                <strong id="population-value-rock">33%</strong>
              </div>
              <div class="duquan-population-row">
                <div class="duquan-population-label"><span class="duquan-population-icon is-paper"><img src="assets/paper.svg" alt="" aria-hidden="true" /></span><span>布</span></div>
                <div class="duquan-population-track"><span class="duquan-population-fill is-paper" id="population-fill-paper"></span></div>
                <strong id="population-value-paper">33%</strong>
              </div>
            </div>
          </section>
        </section>

        <section class="duquan-arena-section" id="arena-section" hidden>
          <div class="duquan-stage-wrap">
            <canvas id="duquan-canvas" width="960" height="620" tabindex="0" role="application" aria-label="剪刀石頭布模擬拳台"></canvas>
            <div class="duquan-result-card" id="result-card" hidden aria-live="polite">
              <strong id="result-title">剪刀稱霸</strong>
              <p id="result-copy">—</p>
              <button class="duquan-primary-button" id="next-round-button" type="button">開始下一輪</button>
            </div>
          </div>
          <div class="duquan-status-row">
            <p class="duquan-status" id="status-value" role="status" aria-live="polite">模擬啟動中…</p>
            <span class="duquan-last-event" id="last-event">等待第一次碰撞</span>
          </div>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
