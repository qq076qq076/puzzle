<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>2048 · 合併成為更大的你</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <a class="back-link" href="../../index.html"><span aria-hidden="true">←</span> 所有遊戲</a>

      <section class="game-layout" aria-labelledby="game-title">
        <header class="intro-panel">
          <div class="eyebrow"><span class="eyebrow-dot"></span> CLASSIC PUZZLE · 4 × 4</div>
          <h1 id="game-title">2048<span class="title-period">.</span></h1>
          <p class="tagline">把相同數字合在一起，<br />一步一步，拼出 2048。</p>
          <p class="intro-copy">每次移動都會帶來新的方塊。保持棋盤有空間，讓你的最大數字留在角落。</p>
        </header>

        <section class="game-panel" aria-label="2048 遊戲">
          <div class="game-toolbar">
            <div class="score-group" aria-label="分數">
              <div class="score-box">
                <span class="score-label">SCORE</span>
                <strong id="score">0</strong>
              </div>
              <div class="score-box score-box-muted" aria-label="最高分">
                <span class="score-label">BEST</span>
                <strong id="best-score">0</strong>
              </div>
            </div>
            <button class="button button-primary" id="new-game" type="button">重新開始 <span aria-hidden="true">↗</span></button>
          </div>

          <div class="game-stage">
            <div class="board-shell" id="board-shell">
              <div class="board" id="board" role="grid" aria-label="2048 棋盤"></div>
              <div class="tile-layer" id="tile-layer" aria-hidden="true"></div>
              <div class="message" id="message" hidden>
                <div class="message-card">
                  <div class="message-kicker" id="message-kicker">NICE WORK</div>
                  <h2 id="message-title">你達成了 2048！</h2>
                  <p id="message-description">還要繼續挑戰更高的數字嗎？</p>
                  <div class="message-actions">
                    <button class="button button-primary" id="keep-playing" type="button">繼續遊戲</button>
                    <button class="button button-quiet" id="message-new-game" type="button">重新開始</button>
                  </div>
                </div>
              </div>
            </div>
            <p class="mobile-hint"><span aria-hidden="true">✦</span> 手機上可以滑動棋盤</p>
          </div>

          <div class="how-to-play">
            <div class="how-to-icon" aria-hidden="true">↕</div>
            <div>
              <strong>怎麼玩</strong>
              <span>使用方向鍵，或在手機上滑動棋盤</span>
            </div>
          </div>
        </section>
      </section>

      <footer class="page-footer">
        <span>KEEP GOING</span>
        <span class="footer-rule" aria-hidden="true"></span>
        <span>每一步都算數</span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
