<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7ed" />
    <meta name="description" content="15×15 五子棋，支援本機雙人與電腦對弈。" />
    <title>五子棋 · 連成五子</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body class="gomoku-page">
    <main class="page-shell gomoku-shell">
      <a class="back-link" href="../../index.html"><span aria-hidden="true">←</span> 所有遊戲</a>

      <section class="gomoku-panel" aria-label="五子棋遊戲">
          <div class="gomoku-settings" aria-label="遊戲設定">
            <label class="gomoku-setting">
              <span>對戰模式</span>
              <select id="gomoku-game-mode">
                <option value="local">雙人對弈</option>
                <option value="computer">電腦對弈</option>
              </select>
            </label>
            <div class="gomoku-computer-settings" id="gomoku-computer-settings" hidden>
              <label class="gomoku-setting">
                <span>難度</span>
                <select id="gomoku-difficulty">
                  <option value="easy">簡單</option>
                  <option value="medium" selected>普通</option>
                  <option value="hard">困難</option>
                </select>
              </label>
              <label class="gomoku-setting">
                <span>玩家執棋</span>
                <select id="gomoku-human-color">
                  <option value="1">黑棋</option>
                  <option value="2">白棋</option>
                </select>
              </label>
            </div>
          </div>
          <div class="gomoku-toolbar">
            <div class="gomoku-turn-box">
              <span class="score-label">TURN</span>
              <strong id="current-player-label">黑棋</strong>
            </div>
            <div class="gomoku-toolbar-actions">
              <span class="gomoku-move-count" id="move-count">0 手</span>
              <button class="button button-quiet" id="undo-gomoku-move" type="button" disabled>悔棋</button>
              <button class="button button-primary" id="new-gomoku-game" type="button">重新開始 <span aria-hidden="true">↗</span></button>
            </div>
          </div>

          <p class="gomoku-status is-black" id="gomoku-status" role="status" aria-live="polite">黑棋回合，請落子。</p>

          <div class="gomoku-board-shell">
            <div class="gomoku-board" id="gomoku-board" role="grid" aria-label="五子棋 15×15 棋盤"></div>
          </div>

        </section>
    </main>

    <script src="../firebase-config.js"></script>
    <script src="../firebase-runtime.js"></script>
    <script src="../save-system.js"></script>
    <script src="rules.js"></script>
    <script src="ai.js"></script>
    <script src="script.js"></script>
  </body>
</html>
